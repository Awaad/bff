[project]
name = "bff-control"
version = "0.0.0"
description = "Backend for Framer control-plane application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
