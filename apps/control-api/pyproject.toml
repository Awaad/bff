[project]
name = "bff-control"
version = "0.0.0"
description = "Backend for Framer control-plane application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.31.0",
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "opentelemetry-sdk==1.42.1",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.14.0",
  "sqlalchemy[asyncio]==2.0.52",
  "starlette==0.50.0",
  "uvicorn==0.48.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"
